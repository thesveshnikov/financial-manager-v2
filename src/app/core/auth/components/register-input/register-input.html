<div class="field">
  <label>{{ label() }}</label>

  <input
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value"
    [disabled]="disabled"
    [class.invalid]="invalid()"
    (input)="updateValue($any($event.target).value)"
    (blur)="markAsTouched()"
  />

  @if (invalid() && errorMessage()) {
    <small class="error">
      {{ errorMessage() }}
    </small>
  }
</div>
