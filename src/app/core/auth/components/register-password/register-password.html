<div [formGroup]="form()" class="password-fields">
  <app-register-input
    label="Password"
    placeholder="••••••••"
    type="password"
    formControlName="password"
    [invalid]="showError('password')"
    [errorMessage]="getPasswordError()"
  />

  <app-register-input
    label="Confirm Password"
    placeholder="••••••••"
    type="password"
    formControlName="confirmPassword"
    [invalid]="
      showError('confirmPassword') ||
      (form().hasError('passwordMismatch') &&
        (form().get('confirmPassword')?.touched || submitted()))
    "
    [errorMessage]="getConfirmPasswordError()"
  />

  <button type="button" class="generate-password" (click)="generateStrongPassword()">
    Generate strong password
  </button>
</div>
