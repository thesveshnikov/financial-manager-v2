<div class="modal-overlay">
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="title">
    <h2 id="title">Delete Account</h2>

    <div class="warning">
      <h3>Warning</h3>

      <p>
        This action cannot be undone. Your account will be permanently deleted, and all your data
        will be removed from our servers.
      </p>
    </div>

    <div class="field">
      <label for="confirmation"> Enter <code>DELETE</code> para confirmar: </label>

      <input
        id="confirmation"
        type="text"
        placeholder="Enter DELETE to confirm"
        [value]="confirmation()"
        (input)="confirmation.set($any($event.target).value)"
      />
    </div>

    <div class="actions">
      <button
        class="btn btn-delete"
        type="button"
        (click)="confirmDelete()"
        [disabled]="!canDelete"
      >
        {{ isDeleting() ? 'Deleting...' : 'Permanently delete' }}
      </button>

      <button class="btn btn-cancel" type="button" (click)="closeModal()" [disabled]="isDeleting()">
        Cancel
      </button>
    </div>
  </section>
</div>
