<div class="layout">
  <app-sidebar />

  <main class="main">
    <div class="row">
      <h1>Dashboard</h1>

      <a class="button primary" routerLink="/expenses"> + Add Expense </a>
    </div>

    <app-dashboard-stats
      [totalExpenses]="totalExpenses"
      [totalTransactions]="totalTransactions"
      [fixedExpenses]="fixedExpenses"
      [fixedCount]="fixedCount"
      [variableExpenses]="variableExpenses"
      [variableCount]="variableCount"
      [monthlyExpenses]="monthlyExpenses"
      [monthlyCount]="monthlyCount"
    />

    <section class="grid">
      <app-recent-expenses [expenses]="recentExpenses" />

      <app-category-summary [categories]="categorySummaries" />

      <app-expense-insights
        [mostExpensiveCategory]="mostExpensiveCategory"
        [mostExpensiveCategoryTotal]="mostExpensiveCategoryTotal"
        [averageExpense]="averageExpense"
        [highestExpense]="highestExpense"
        [lowestExpense]="lowestExpense"
      />

      <app-dashboard-actions />
    </section>
  </main>
</div>
